    <!--
      Das Browser-Icon ist ein quadratischer Zuschnitt auf den Frosch aus
      logoicon.png. Das ganze Zeichen mit Vogel wird bei 16-32px unlesbar, und
      logoicon.png selbst ist 1657x1137 — nicht quadratisch, also für Google
      als Favicon unbrauchbar. Der hellblaue Grund ist der des Logo-Kästchens
      (#F4F5FB); ohne ihn verschwände die dunkle Zeichnung in dunklen Tableisten.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
